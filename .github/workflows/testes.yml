name: Testes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-offline:
    name: Testes offline — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Executar testes de domínio, serviços e esquema SQL
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
