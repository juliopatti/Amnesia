name: Testes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-offline:
    name: Testes offline — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Executar testes de domínio, serviços e esquema SQL
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  navegador:
    name: Cadastro e busca no navegador com runtime Cloudflare local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar ferramentas de desenvolvimento
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Preparar banco isolado de testes
        run: uv run pywrangler d1 migrations apply amnesia --local --persist-to .wrangler/test-state
      - name: Testar cadastro, busca, edição, fotos e proteção HTTP
        run: npm run test:e2e
